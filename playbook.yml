---
- name: Setup Neovim Development Environment
  hosts: localhost
  connection: local
  become: false
  
  vars:
    home_dir: "{{ ansible_env.HOME }}"
    nvim_config_dir: "{{ home_dir }}/.config/nvim"
    node_version: "20.15.1"
    
  tasks:
    - name: Detect OS
      set_fact:
        is_macos: "{{ ansible_os_family == 'Darwin' }}"
        is_linux: "{{ ansible_os_family in ['Debian', 'RedHat'] }}"

    # macOS Setup
    - name: Install Homebrew packages (macOS)
      when: is_macos
      community.general.homebrew:
        name:
          - neovim
          - lua
          - luarocks
          - node
          - npm
          - yarn
          - jq
          - go
          - rust
          - python3
          - openjdk@21
          - openjdk@11
          - php
          - composer
          - llvm
          - cmake
          - jenv
          - zsh
        state: present

    - name: Install Homebrew casks (macOS)
      when: is_macos
      community.general.homebrew_cask:
        name:
          - iterm2
          - kitty
        state: present

    - name: Symlink OpenJDK 21 for macOS
      when: is_macos
      become: true
      file:
        src: "/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk"
        dest: "/Library/Java/JavaVirtualMachines/openjdk-21.jdk"
        state: link
        force: yes

    # Linux Setup (Debian/Ubuntu)
    - name: Install APT packages (Debian/Ubuntu)
      when: ansible_os_family == 'Debian'
      become: true
      apt:
        name:
          - neovim
          - lua5.4
          - luarocks
          - nodejs
          - npm
          - jq
          - golang
          - rustc
          - cargo
          - python3
          - python3-pip
          - openjdk-21-jdk
          - openjdk-11-jdk
          - php
          - composer
          - cmake
          - build-essential
          - git
          - curl
          - unzip
          - zsh
          - kitty
        state: present
        update_cache: yes

    # Linux Setup (RHEL/Fedora/CentOS)
    - name: Install DNF packages (RHEL/Fedora)
      when: ansible_os_family == 'RedHat'
      become: true
      dnf:
        name:
          - neovim
          - lua
          - luarocks
          - nodejs
          - npm
          - jq
          - golang
          - rust
          - cargo
          - python3
          - python3-pip
          - java-21-openjdk
          - java-11-openjdk
          - php
          - composer
          - cmake
          - gcc
          - gcc-c++
          - make
          - git
          - curl
          - unzip
          - zsh
          - kitty
        state: present

    # NVM and Node.js setup
    - name: Check if NVM is installed
      stat:
        path: "{{ home_dir }}/.nvm/nvm.sh"
      register: nvm_installed

    - name: Install NVM
      when: not nvm_installed.stat.exists
      shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
      args:
        creates: "{{ home_dir }}/.nvm/nvm.sh"

    - name: Install Node.js via NVM
      shell: |
        source {{ home_dir }}/.nvm/nvm.sh && nvm install {{ node_version }} && nvm use {{ node_version }}
      args:
        executable: /bin/bash
        creates: "{{ home_dir }}/.nvm/versions/node/v{{ node_version }}"

    # jEnv Setup
    - name: Check if jEnv is installed (Linux)
      when: is_linux
      stat:
        path: "{{ home_dir }}/.jenv"
      register: jenv_dir

    - name: Install jEnv (Linux)
      when: is_linux and not jenv_dir.stat.exists
      git:
        repo: https://github.com/jenv/jenv.git
        dest: "{{ home_dir }}/.jenv"

    - name: Add Java versions to jEnv (macOS)
      when: is_macos
      shell: |
        export PATH="{{ home_dir }}/.jenv/bin:$PATH"
        eval "$(jenv init -)"
        jenv add /opt/homebrew/opt/openjdk@21 || true
        jenv add /opt/homebrew/opt/openjdk@11 || true
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Add Java versions to jEnv (Linux)
      when: is_linux
      shell: |
        export PATH="{{ home_dir }}/.jenv/bin:$PATH"
        eval "$(jenv init -)"
        jenv add /usr/lib/jvm/java-21-openjdk-amd64 || true
        jenv add /usr/lib/jvm/java-11-openjdk-amd64 || true
        jenv add /usr/lib/jvm/java-21-openjdk || true
        jenv add /usr/lib/jvm/java-11-openjdk || true
      args:
        executable: /bin/bash
      ignore_errors: yes

    # Node.js packages (Global requirements for some LSPs/Plugins)
    - name: Install global npm packages
      npm:
        name: "{{ item }}"
        global: yes
        state: present
      loop:
        - '@vue/language-server'
        - typescript
        - yarn
      environment:
        PATH: "{{ home_dir }}/.nvm/versions/node/v{{ node_version }}/bin:{{ ansible_env.PATH }}"
      ignore_errors: yes

    # Neovim Setup (Bootstrap lazy.nvim is handled by init.lua, but we ensure git is here)
    - name: Ensure git is installed for lazy.nvim
      package:
        name: git
        state: present

    - name: Create Neovim config directory
      file:
        path: "{{ nvim_config_dir }}/lua"
        state: directory
        recurse: yes

    - name: Display completion message
      debug:
        msg:
          - "Neovim setup complete!"
          - "Please run 'nvim' - lazy.nvim will automatically install all plugins"
          - "You may need to restart your shell to use newly installed tools"
          - "zsh, iTerm2/Kitty have been installed. You can switch terminal to your preference."
          - "For jEnv and NVM, ensure you have initialized them in your shell profile (.zshrc or .bashrc):"
          - "  NVM: [ -s \"$HOME/.nvm/nvm.sh\" ] && . \"$HOME/.nvm/nvm.sh\""
          - "  jEnv: export PATH=\"$HOME/.jenv/bin:$PATH\" && eval \"$(jenv init -)\""
          - "For Go tools, ensure {{ home_dir }}/go/bin is in your PATH"
          - "For Composer tools, ensure {{ home_dir }}/.composer/vendor/bin is in your PATH"
